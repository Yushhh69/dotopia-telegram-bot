<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Dotopia — Members</title>
  <style>
    :root{color-scheme:dark;--bg:#101010;--panel:#171717;--line:#302b22;--gold:#d4b77b;--muted:#aaa49a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#f4f0e8;font:16px/1.6 Arial,sans-serif;min-height:100vh}
    header{max-width:1100px;margin:auto;padding:26px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .brand{font-family:Georgia,serif;letter-spacing:.16em;color:var(--gold);font-size:20px;text-decoration:none}
    main{max-width:1000px;margin:0 auto;padding:76px 24px}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.2em}
    h1{font:normal clamp(38px,7vw,64px)/1.08 Georgia,serif;margin:14px 0}
    p{color:var(--muted)}
    .panel{margin-top:38px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:28px}
    button{background:transparent;border:1px solid var(--line);color:#eee;padding:10px 16px;border-radius:8px;cursor:pointer}
    .status{color:var(--gold);font-size:14px}
    @media(max-width:600px){main{padding-top:48px}.panel{padding:20px}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">DOTOPIA.</a>
    <button id="logoutButton" type="button">Sign out</button>
  </header>
  <main>
    <div class="eyebrow">PRIVATE MEMBER SPACE</div>
    <h1>A little closer.</h1>
    <p id="welcomeText">Checking your membership…</p>
    <section class="panel">
      <div class="eyebrow">YOUR LIBRARY</div>
      <h2>Welcome to Dotopia.</h2>
      <p id="libraryMessage">Your private content space is ready. New collections will appear here as they are published.</p>
      <p class="status" id="membershipStatus" role="status"></p>
    </section>
  </main>
  <script>
    const API_BASE = "https://dotopia-backend.aayushmanwal-12.workers.dev";
    async function checkMembership() {
      const response = await fetch(API_BASE + "/website/me", { credentials: "include" });
      if (!response.ok) {
        window.location.replace("/#redeem");
        return;
      }
      const data = await response.json();
      document.getElementById("welcomeText").textContent = "Your membership is active. Enjoy your private space.";
      document.getElementById("membershipStatus").textContent =
  "Membership valid until " +
  new Date(data.membership.membership_end).toLocaleDateString("en-IN");
    }
    document.getElementById("logoutButton").addEventListener("click", async () => {
      await fetch(API_BASE + "/website/logout", { method: "POST", credentials: "include" });
      window.location.replace("/");
    });
    checkMembership().catch(() => {
      document.getElementById("welcomeText").textContent = "Unable to verify your membership. Please try again.";
    });
  </script>
</body>
</html>
