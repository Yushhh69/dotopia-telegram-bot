
name: Keep Dotopia Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Dotopia Render Server
        run: |
          echo "Pinging Dotopia Render..."
          curl -fsS --retry 2 --retry-delay 5 \
            --connect-timeout 15 --max-time 90 \
            https://dotopia-telegram-bot.onrender.com/
          echo "Render server responded successfully."
